name: OptiKart CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://optikart:optikart@localhost:5432/optikart
      DIRECT_URL: postgresql://optikart:optikart@localhost:5432/optikart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run build
